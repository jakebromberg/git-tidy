[package]
name = "git-branch-tidy"
version = "0.1.0"
edition = "2024"
description = "Scan, classify, and interactively remove stale local Git branches"

[dependencies]
git-tidy-core = { path = "../git-tidy-core" }
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dialoguer = "0.11"
console = "0.15"

[dev-dependencies]
git-tidy-core = { path = "../git-tidy-core", features = ["testutil"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
