[package]
name = "git-tidy-core"
version = "0.1.0"
edition = "2024"
description = "Shared classification logic and git abstraction for git-worktree-tidy and git-branch-tidy"

[features]
testutil = ["dep:tempfile"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
gix = { version = "0.84", features = ["blocking-network-client", "parallel"] }
indicatif = "0.18"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
thiserror = "2"
toml = "1.1"
unicode-width = "0.2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
git-tidy-core = { path = ".", features = ["testutil"] }
jwalk = "0.8"
ignore = "0.4"
rayon = "1"
tempfile = "3"

[[bench]]
name = "discovery"
harness = false

[[bench]]
name = "pipeline"
harness = false

[dependencies.tempfile]
version = "3"
optional = true
