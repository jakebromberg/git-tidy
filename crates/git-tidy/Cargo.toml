[package]
name = "git-tidy"
version = "0.1.0"
edition = "2024"
description = "Audit runner for git-tidy tools"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.18"
which = "8"

# In-process audit dependencies
git-tidy-core = { path = "../git-tidy-core" }
git-worktree-tidy = { path = "../git-worktree-tidy" }
git-branch-tidy = { path = "../git-branch-tidy" }
git-stash-tidy = { path = "../git-stash-tidy" }
git-remote-tidy = { path = "../git-remote-tidy" }
git-tag-tidy = { path = "../git-tag-tidy" }
git-repo-tidy = { path = "../git-repo-tidy" }
git-config-tidy = { path = "../git-config-tidy" }
git-lfs-tidy = { path = "../git-lfs-tidy" }

[dev-dependencies]
git-tidy-core = { path = "../git-tidy-core", features = ["testutil"] }
tempfile = "3"
