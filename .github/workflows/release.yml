name: Release

# Tag a release with `git tag v0.1.0 && git push origin v0.1.0` to build every
# target and publish the archives. Running this workflow manually builds the
# same archives and leaves them as run artifacts without publishing a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The workspace is pure Rust (no openssl-sys, no libgit2-sys), so musl
      # links without a cross toolchain -- musl-tools only supplies the linker
      # driver Cargo expects to find.
      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools

      - name: Build
        env:
          RUSTFLAGS: -C strip=symbols
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          stage="git-tidy-${version}-${{ matrix.target }}"
          mkdir -p "dist/$stage"

          # Mirror install.sh: every crate with a src/main.rs ships a binary.
          for crate in crates/*/; do
            [ -f "$crate/src/main.rs" ] || continue
            name="$(basename "$crate")"
            cp "target/${{ matrix.target }}/release/$name" "dist/$stage/$name"
          done
          cp README.md "dist/$stage/README.md"

          tar -czf "dist/${stage}.tar.gz" -C dist "$stage"
          echo "archive=${stage}.tar.gz" >> "$GITHUB_OUTPUT"
          ls -l "dist/${stage}.tar.gz"
          tar -tzf "dist/${stage}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksum
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            dist/*.tar.gz dist/SHA256SUMS
