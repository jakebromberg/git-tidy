[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/jakebromberg/git-tidy"

# Internal crates are declared once here so a release bumps one version number.
# Each entry carries both `version` (required to publish to crates.io) and
# `path` (used for local workspace builds).
[workspace.dependencies]
git-tidy-core = { version = "0.1.0", path = "crates/git-tidy-core" }
git-worktree-tidy = { version = "0.1.0", path = "crates/git-worktree-tidy" }
git-branch-tidy = { version = "0.1.0", path = "crates/git-branch-tidy" }
git-stash-tidy = { version = "0.1.0", path = "crates/git-stash-tidy" }
git-remote-tidy = { version = "0.1.0", path = "crates/git-remote-tidy" }
git-tag-tidy = { version = "0.1.0", path = "crates/git-tag-tidy" }
git-repo-tidy = { version = "0.1.0", path = "crates/git-repo-tidy" }
git-config-tidy = { version = "0.1.0", path = "crates/git-config-tidy" }
git-lfs-tidy = { version = "0.1.0", path = "crates/git-lfs-tidy" }
